name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of killing one mid-run.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # John can add required reviewers in Settings > Environments.
    # Branch protection should require ci.yml, audit, commit-messages before merge to main.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VITE_API_BASE_URL
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::vars.VITE_API_BASE_URL is empty or not set"
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_API_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          case "$API_URL" in
            */)
              echo "::error::VITE_API_BASE_URL must not end with a trailing slash"
              exit 1
              ;;
          esac
          case "$API_URL" in
            *"/api/v1"*)
              echo "::error::VITE_API_BASE_URL must not contain /api/v1"
              exit 1
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc -b

      - name: Build
        run: pnpm vite build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Check SWA config is in the build output
        run: test -f dist/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
