name: CI

on:
  pull_request:
  push:
    branches: [v1.0.0, main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No version input: reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm exec eslint .

      - name: Unit tests
        run: pnpm exec vitest run --maxWorkers=2

      - name: Build
        run: pnpm exec vite build
        env:
          # Origin only (no path); must pass the startup fail-fast validation.
          VITE_API_BASE_URL: https://api.example.invalid

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO: flip to blocking (remove continue-on-error) after the
    # axios / vite / react-router bumps land.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
